    ResearchTag:
      type: object
      description: >
        One label of the research-workbench palette. Distinct from the library
        Tag: a research tag carries a priority order and a chip tint chosen by
        the user, and a paper wears several of them at once.
      required: [id, name, position, color, color_enabled]
      properties:
        id:
          type: string
          description: >
            Opaque label id. Seeded labels are minted inside the migration, so
            do not assume a canonical uuid spelling.
        name:
          type: string
          minLength: 1
          maxLength: 40
        position:
          type: integer
          minimum: 0
          description: Priority order within the profile; drag to reorder.
        color:
          type: string
          enum: ["", red, amber, gray, green, teal, orange, violet, blue]
          description: >
            Chip tint stored with the label. The empty string is part of the
            contract and means no explicit choice, so the client keeps tinting
            the chip by its palette index.
        color_enabled:
          type: boolean
          description: >
            Whether that tint claims the block at the head of the rows wearing
            the label. False keeps color as it was, colors the chip and dot as
            before, and only drops the row's leading block — which is what lets
            a label group papers without ranking them.
    TaskThread:
      type: object
      description: >
        One 主线 of the 长任务 board and the whole tree under it. The board is a
        personal tool with tens of rows, so the read endpoint hands over every
        thread already assembled rather than asking the client to walk it.
      required: [id, name, position, archived, map_markdown, layers, items, stats]
      properties:
        id:
          type: string
          description: Opaque thread id.
        name:
          type: string
          minLength: 1
          maxLength: 500
        position:
          type: integer
          minimum: 0
          description: Order of the threads on the board.
        archived:
          type: boolean
          description: >
            Archived threads stay in the document; the client filters them out
            rather than the server hiding them.
        map_markdown:
          type: string
          maxLength: 20000
          description: >
            The Markdown outline the mind-map view imported this thread from.
            The nested tree remains authoritative; this field is only the
            editable source.
        layers:
          type: array
          description: The 层 blocks in unlock order, never null.
          items:
            $ref: "#/components/schemas/TaskLayer"
        items:
          type: array
          description: The task cards in board order, never null.
          items:
            $ref: "#/components/schemas/TaskItem"
        stats:
          $ref: "#/components/schemas/TaskStats"
    TaskLayer:
      type: object
      description: >
        One 层: a sequential gate. It is unlocked when it is the thread's first
        layer, when every placement of the previous layer closed, or when it is
        forced open. A locked layer is still writable — the lock is a status the
        pill paints, never a permission.
      required: [id, name, position, unlocked, forced_unlock, item_count, closed_count]
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 500
          description: >
            Defaults to 第N层 by the layer's own 1-based position when a create
            omits the name.
        position:
          type: integer
          minimum: 0
          description: >
            Order within the thread, and the gate's place in the chain: a layer
            is gated by the layer one position lower.
        unlocked:
          type: boolean
          description: Derived on read, never stored.
        forced_unlock:
          type: boolean
          description: >
            The stored escape hatch behind unlocked. Clearing it re-shuts a layer
            whose predecessor is still open.
        item_count:
          type: integer
          minimum: 0
          description: Placements in this layer — the pill's denominator.
        closed_count:
          type: integer
          minimum: 0
          description: >
            Placements of this layer whose every step is done, the numerator. A
            layer with no placement counts as fully closed, so the chain does
            not deadlock on an empty predecessor.
    TaskItem:
      type: object
      description: >
        One board card. A card is placed in one or more layers; its status,
        percentage and step tally are computed across all of those placements,
        because it is one task and not one task per layer.
      required: [id, title, notes, position, paper_id, closed_at, closed, layer_count, progress, status, stats, assignments]
      properties:
        id:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 500
        notes:
          type: string
          maxLength: 2000
        position:
          type: integer
          minimum: 0
        paper_id:
          type: [string, "null"]
          description: >
            The 科研工作台 paper this card is linked to, or null when it is not.
            The status strip and the cards are separate concerns, so linking is
            optional in both directions.
        closed_at:
          type: string
          description: >
            Display stamp for 已收口, written when the last placement closed and
            cleared when any of them reopens. Empty when the card is open.
        closed:
          type: boolean
          description: >
            Derived: the card has at least one placement and every one of them
            is closed.
        layer_count:
          type: integer
          minimum: 0
          description: How many layers hold this card; above 1 draws 跨 N 层.
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: >
            Done steps over total steps across every placement, rounded, and 0
            when the card has no steps. Two cards of one task always print the
            same number.
        status:
          type: string
          enum: [active, locked, unstarted, overdue, closed]
          description: >
            Exactly one applies, tested in the order closed, locked, overdue,
            unstarted, active. A card that is both late and sitting behind a
            shut layer reports locked, because late work nobody can reach is not
            yet actionable; a card whose checklist ran out is 已收口 even while
            its layer stays shut.
        stats:
          $ref: "#/components/schemas/TaskItemStats"
        assignments:
          type: array
          description: >
            This card's placements, ordered by their layer's position, never
            null. An empty list means the card is on the board but queued into
            no layer yet.
          items:
            $ref: "#/components/schemas/TaskAssignment"
    TaskItemStats:
      type: object
      required: [total_steps, done_steps]
      properties:
        total_steps:
          type: integer
          minimum: 0
          description: Steps across every placement of the card, the 1/1 步 line.
        done_steps:
          type: integer
          minimum: 0
    TaskAssignment:
      type: object
      description: >
        One card placed in one layer, with its own date window and its own
        checklist. This is the row the 本层已收口 chip and the 完成 button act on.
      required: [id, layer_id, layer_position, position, start_date, due_date, closed, closed_at, steps]
      properties:
        id:
          type: string
        layer_id:
          type: string
        layer_position:
          type: integer
          minimum: 0
          description: >
            The owning layer's position, carried so a client can sort a card's
            placements without a second lookup into the layer list.
        position:
          type: integer
          minimum: 0
          description: Order of this card's placements among its siblings.
        start_date:
          type: string
          description: YYYY-MM-DD, or empty when unset.
        due_date:
          type: string
          description: YYYY-MM-DD, or empty when unset; never before start_date.
        closed:
          type: boolean
          description: >
            Derived: the placement has at least one step and all of them are
            done. A stepless placement is never closed.
        closed_at:
          type: string
          description: Stamp written with that last flip, cleared on the flip back.
        steps:
          type: array
          description: The checklist, in order, never null.
          items:
            $ref: "#/components/schemas/TaskStep"
    TaskStep:
      type: object
      required: [id, name, done, position, done_at]
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 500
        done:
          type: boolean
        position:
          type: integer
          minimum: 0
        done_at:
          type: string
          description: Empty while the box is unticked.
    TaskStats:
      type: object
      description: >
        The five-cell strip and the header fraction. The status counts are over
        distinct cards and always sum to total; slots counts placements, so a
        card sitting in two layers occupies two slots.
      required: [active, locked, unstarted, overdue, closed, total, slots, slots_closed]
      properties:
        active: { type: integer, minimum: 0 }
        locked: { type: integer, minimum: 0 }
        unstarted: { type: integer, minimum: 0 }
        overdue: { type: integer, minimum: 0 }
        closed: { type: integer, minimum: 0 }
        total:
          type: integer
          minimum: 0
          description: Cards on the thread, the 13 of 主线任务（论文+项目）3/13.
        slots:
          type: integer
          minimum: 0
          description: Placements on the thread.
        slots_closed:
          type: integer
          minimum: 0
          description: Closed placements, the numerator of the header fraction.
    Rule:
      type: object
      required: [id, name, enabled, priority, conditions, actions, created_at, updated_at]
