  /api/v1/research/papers/{paperId}:
    parameters:
      - name: paperId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getResearchPaper
      tags: [research]
      responses:
        "200":
          description: >
            A single research workspace paper. Its tag_ids are every label
            assigned to it, in assignment order, and never null.
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateResearchPaper
      tags: [research]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                Partial update. Text fields accept at most 500 characters
                (notes and abstract at most 2000), submission_count must not
                be negative, and a paper wears at most 12 tags; violations
                return 400 with code invalid_research_paper.
              properties:
                title: { type: string, maxLength: 500 }
                authors: { type: array, items: { type: string, maxLength: 500 } }
                keywords: { type: array, items: { type: string, maxLength: 500 } }
                file_path: { type: string, maxLength: 500 }
                next_action: { type: string, maxLength: 500 }
                notes: { type: string, maxLength: 2000 }
                research_area: { type: string, maxLength: 500 }
                status: { type: string, maxLength: 500 }
                tag_ids:
                  type: array
                  maxItems: 12
                  items: { type: string, maxLength: 500 }
                  description: >
                    Ids of tags from /api/v1/research/tags. A paper wears them
                    all at once, and the array order is the order the user
                    assigned them in, not the palette order. Repeats collapse,
                    an empty array clears every label, and omitting the field
                    leaves the assignment untouched. Unknown ids are accepted
                    and simply render as nothing until the palette is reloaded.
                target_journal: { type: string, maxLength: 500 }
                stages:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string, maxLength: 500 }
                      done: { type: boolean }
                      children: { type: array, items: { type: object } }
                current_journal: { type: string, maxLength: 500 }
                submission_date: { type: string, maxLength: 500 }
                manuscript_id: { type: string, maxLength: 500 }
                submission_count: { type: integer, minimum: 0 }
                target_level: { type: string, maxLength: 500 }
                editor: { type: string, maxLength: 500 }
                deadline: { type: string, maxLength: 500 }
                history:
                  type: array
                  items:
                    type: object
                    properties:
                      journal: { type: string, maxLength: 500 }
                      date: { type: string, maxLength: 500 }
                      status: { type: string, maxLength: 500 }
                abstract: { type: string, maxLength: 2000 }
                journal: { type: string, maxLength: 500 }
                language: { type: string, maxLength: 500 }
                year: { type: string, maxLength: 500 }
                volume: { type: string, maxLength: 500 }
                issue: { type: string, maxLength: 500 }
                pages: { type: string, maxLength: 500 }
                doi: { type: string, maxLength: 500 }
                citations: { type: [integer, "null"] }
                citation_source: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Updated paper.
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteResearchPaper
      tags: [research]
      responses:
        "204":
          description: Paper deleted.
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/research/papers/{paperId}/move:
    parameters:
      - name: paperId
        in: path
        required: true
