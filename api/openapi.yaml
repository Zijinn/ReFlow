        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/research/papers/{paperId}/citation:
    parameters:
      - name: paperId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: fetchResearchCitation
      tags: [research]
      description: >
        Refreshes the citation count from Crossref. Returns 422 with code
        citation_no_doi when the paper has no usable DOI, or doi_not_found
        when Crossref has no work for the DOI; 502 crossref_unavailable is
        retryable.
      responses:
        "200":
          description: Citation count refreshed from Crossref.
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /api/v1/research/tags:
    get:
      operationId: listResearchTags
      tags: [research]
      description: >
        The profile's tag palette in priority order. A fresh database seeds the
        three priority labels at positions 0, 1 and 2 - High in red, Medium in
        amber, Low in green - and a profile that already owns labels is left
        alone. Drag the palette into a new order with
        POST /api/v1/research/tags/reorder.
      responses:
        "200":
          description: Tags ordered by position.
          content:
            application/json:
              schema:
                type: object
                required: [tags]
                properties:
                  tags:
                    type: array
                    items:
                      $ref: "#/components/schemas/ResearchTag"
    post:
      operationId: createResearchTag
      tags: [research]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 40
                  description: Trimmed; a name already used by the profile returns 409.
                color:
                  type: string
                  enum: ["", red, amber, gray, green, teal, orange, violet, blue]
                  description: >
                    Optional chip tint, omitted or empty for no explicit
                    choice. Any other value returns 400 with code
                    invalid_research_tag.
      responses:
        "201":
          description: Tag appended to the end of the palette.
          content:
            application/json:
              schema:
                type: object
                required: [tag]
                properties:
                  tag:
                    $ref: "#/components/schemas/ResearchTag"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/research/tags/reorder:
    post:
      operationId: reorderResearchTags
      tags: [research]
      description: >
        Rewrites the palette to the given order so the settings list can be
        dragged. Ids outside the profile are ignored, and a paper's own tag_ids
        keep their assignment order across a palette reorder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag_ids]
              properties:
                tag_ids:
                  type: array
                  maxItems: 500
                  items: { type: string }
      responses:
        "204":
          description: Palette order updated.
        "400":
          $ref: "#/components/responses/Problem"
  /api/v1/research/tags/{tagId}:
    parameters:
      - name: tagId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateResearchTag
      tags: [research]
      description: >
        Partial update of a palette entry: renames it, recolours it, mutes or
        unmutes its colour, or any of these together. An omitted field is left
        untouched, so the settings pane can send the one control the user
        actually changed. Papers reference tags by id, so their tag_ids are
        unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 40
                color:
                  type: string
                  enum: ["", red, amber, gray, green, teal, orange, violet, blue]
                  description: >
                    Passing the empty string clears the choice, which returns
                    the chip to index-derived tinting; an unknown name returns
                    400 with code invalid_research_tag.
                color_enabled:
                  type: boolean
                  description: >
                    Whether the label claims the block of colour at the head of
                    the rows that wear it. False hands that block to the next
                    label while the chip and its dot keep their colour. It is a
                    separate field from color so switching off does not erase the
                    shade it will come back to.
      responses:
        "200":
          description: Updated tag.
          content:
            application/json:
              schema:
                type: object
                required: [tag]
                properties:
                  tag:
                    $ref: "#/components/schemas/ResearchTag"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteResearchTag
      tags: [research]
      description: >
        Deletes a tag and lifts just that label from every paper wearing it;
        the other labels a paper wears keep their order.
      responses:
        "204":
          description: Tag deleted and removed from every paper.
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/threads:
    get:
      operationId: listTaskThreads
      tags: [tasks]
      description: >
        The whole 长任务 board in one document: every 主线 with its 层, its task
        cards, and each card's placements with their steps. There is no second
        read endpoint, because none of the board's state is stored — whether a
        layer is unlocked, what status a card carries, its percentage and the
        five-cell stats are all recomputed from the step rows on every read.
        One document keeps that derived vocabulary in exactly one place, so a
        client can never disagree with the board it is drawing. Archived
        threads are included; the client hides them with the archived flag.
      responses:
        "200":
          description: Every thread of the profile, in position order, fully nested.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TaskThread"
    post:
      operationId: createTaskThread
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "201":
          description: >
            The new 主线, empty. A thread with no layer is an ordinary state
            rather than an error, and the first layer added to it is unlocked
            because it has no predecessor to wait for.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskThread"
        "400":
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/threads/{threadId}:
    parameters:
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateTaskThread
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 500 }
                position: { type: integer, minimum: 0 }
                archived: { type: boolean }
                map_markdown: { type: string, maxLength: 20000 }
      responses:
        "200":
          description: Updated thread, re-read through the board.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskThread"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteTaskThread
      tags: [tasks]
      description: >
        Deletes the 主线 and, with it, its layers, cards, placements and steps.
        Referential cascade is the only deletion gate the board has.
      responses:
        "204":
          description: Thread and everything under it deleted.
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/threads/{threadId}/layers:
    parameters:
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createTaskLayer
      tags: [tasks]
      description: >
        Appends a sequential gate to the thread. Omit name entirely to let the
        server label the layer by its own ordering rule (第1层, 第2层, ...), which
        is what the board's one-click 加层 sends. An explicitly blank name is a
        400 — the default exists for the absent field, not for an empty one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "201":
          description: The new layer with its unlock state already resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskLayer"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/threads/{threadId}/items:
    parameters:
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createTaskItem
      tags: [tasks]
      description: >
        Appends a task card to the thread. With layer_id the card is also placed
        in that layer in the same call, because dropping a card onto a 层 block
        is one user action and two round trips would let a half-created card
        show up in between. Without layer_id the card exists on the board with
        no placement, which reads as unstarted. Omit title to get the 未命名任务
        placeholder — the board adds the card first and lets the owner name it
        after; an explicitly blank title is a 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 500
                layer_id: { type: string }
      responses:
        "201":
          description: The new card, with its placement if one was requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskItem"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/threads/{threadId}/items/reorder:
    parameters:
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: reorderTaskItems
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_ids]
              properties:
                item_ids:
                  type: array
                  maxItems: 500
                  items: { type: string }
      responses:
        "204":
          description: Order updated; the array index becomes the new position.
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/layers/{layerId}:
    parameters:
      - name: layerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateTaskLayer
      tags: [tasks]
      description: >
        forced_unlock is the escape hatch: it opens a layer whose predecessor is
        stuck without touching that predecessor's work. Clearing it re-shuts the
        layer, since an unlock is read from the checklists and not latched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 500 }
                position: { type: integer, minimum: 0 }
                forced_unlock: { type: boolean }
      responses:
        "200":
          description: Updated layer, with the whole chain re-resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskLayer"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteTaskLayer
      tags: [tasks]
      description: >
        Deletes the layer and lifts its placements; the cards themselves stay on
        the board, and a card whose only placement was here returns to
        unstarted. Removing the only layer of a thread needs no special case.
      responses:
        "204":
          description: Layer deleted.
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/layers/{layerId}/close:
    parameters:
      - name: layerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: closeTaskLayer
      tags: [tasks]
      description: >
        The layer-wide 完成: ticks every step of every placement of this layer,
        which closes those placements and opens the next layer through the
        chain. Steps already ticked keep the done_at they were originally
        stamped with.
      responses:
        "200":
          description: The layer as it now reads, pill included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskLayer"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateTaskItem
      tags: [tasks]
      description: >
        paper_id is tri-state, like a research paper's citations: omit the field
        to leave the link alone, send null to unlink the card, send a paper id
        to re-point it. An unknown paper id is a 400 with code
        invalid_task_item.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: { type: string, minLength: 1, maxLength: 500 }
                notes: { type: string, maxLength: 2000 }
                position: { type: integer, minimum: 0 }
                paper_id:
                  type: [string, "null"]
                  description: >
                    A research paper id, or null to clear the link. Null is the
                    unlink signal and is not the same as leaving the field out.
      responses:
        "200":
          description: Updated card, re-derived across every layer it sits in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskItem"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteTaskItem
      tags: [tasks]
      description: Deletes the card with its placements and their steps.
      responses:
        "204":
          description: Card deleted.
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/items/{itemId}/assignments:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createTaskAssignment
      tags: [tasks]
      description: >
        Places an existing card in an existing layer — this is what makes the
        跨 N 层 chip grow. A locked layer accepts the placement: the board lets
        the owner queue work for a layer that has not opened yet, so a lock is
        never a permission and this call does not answer 409 for it. The only
        409 here is a duplicate placement of the same card in the same layer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [layer_id]
              properties:
                layer_id: { type: string }
                start_date:
                  type: string
                  pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
                due_date:
                  type: string
                  pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
                  description: >
                    Both ends are optional and blank means unset; a date that is
                    not a real calendar day, and a due date earlier than the
                    start date, are 400 with code invalid_task_assignment.
      responses:
        "201":
          description: The new placement, empty of steps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAssignment"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/assignments/{assignmentId}:
    parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateTaskAssignment
      tags: [tasks]
      description: >
        One placement's own window and order. The date range is re-checked
        across both ends even when the patch mentions only one, so a card
        already due on 10-31 cannot accept a start date of 11-02.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                start_date:
                  type: string
                  pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
                due_date:
                  type: string
                  pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
                position: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Updated placement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAssignment"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteTaskAssignment
      tags: [tasks]
      description: >
        Takes the card out of this layer only. Removing the placement that made
        a card closed brings the card and its remaining stamps back open.
      responses:
        "204":
          description: Placement deleted.
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/assignments/{assignmentId}/complete:
    parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: completeTaskAssignment
      tags: [tasks]
      description: >
        The card-level 完成 button: ticks the whole checklist of this placement
        in one click. A placement with no steps has nothing to close and stays
        open, because 本层已收口 means the checklist ran out, not the button.
      responses:
        "200":
          description: The placement as it now reads, with its steps ticked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAssignment"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/assignments/{assignmentId}/steps:
    parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createTaskStep
      tags: [tasks]
      description: >
        Appends one checkbox to a placement. Adding an undone step to a closed
        placement takes its 本层已收口 chip away, and the card's percentage is
        recomputed across every layer it sits in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "201":
          description: The new step, undone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStep"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/steps/{stepId}:
    parameters:
      - name: stepId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateTaskStep
      tags: [tasks]
      description: >
        done_at is stamped when the step flips to done and cleared when it flips
        back. A patch that repeats the value already stored leaves the original
        stamp alone, so closing a layer in one click does not rewrite when work
        finished last week. Flipping the last undone step closes the placement
        and stamps its card.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 500 }
                done: { type: boolean }
                position: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Updated step.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStep"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteTaskStep
      tags: [tasks]
      description: >
        Drops one checkbox. Removing the only undone step closes the placement
        by subtraction, so the stamps are reconciled like any other step change.
      responses:
        "204":
          description: Step deleted.
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/quick:
    get:
      operationId: listQuickTasks
      tags: [tasks]
      description: >
        Returns every 即时任务, open ones first, then completed ones. A quick
        task is flat: it has no layer, no steps, and does not participate in
        the long-task unlock chain.
      responses:
        "200":
          description: Every quick task of the profile.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/QuickTask"
    post:
      operationId: createQuickTask
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 500 }
                notes: { type: string, maxLength: 2000 }
                tags:
                  type: array
                  maxItems: 12
                  items: { type: string, minLength: 1, maxLength: 40 }
                start_date: { type: string, pattern: "^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
                due_date: { type: string, pattern: "^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
                paper_id: { type: [string, "null"], format: uuid }
      responses:
        "201":
          description: The new quick task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickTask"
        "400":
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/dida:
    get:
      operationId: getDidaSyncStatus
      tags: [tasks]
      description: Report whether the dida CLI is reachable and which Dida list the workbench syncs with.
      responses:
        "200":
          description: Dida sync availability.
          content:
            application/json:
              schema:
                type: object
                required: [available, project]
                properties:
                  available: { type: boolean }
                  project: { type: string }
                  command: { type: string }
                  reason: { type: string }
  /api/v1/tasks/dida/push:
    post:
      operationId: pushTasksToDida
      tags: [tasks]
      description: >
        Push the profile's 即时任务 to the configured Dida list. Creates missing
        Dida tasks and updates mapped ones; it never imports or deletes tasks.
      responses:
        "200":
          description: The sync plan and what was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DidaSyncResult"
        "409":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/dida/pull:
    post:
      operationId: pullTasksFromDida
      tags: [tasks]
      description: >
        Pull the configured Dida list into 即时任务. Creates missing ReFlow tasks
        and updates mapped ones; it never pushes or deletes tasks.
      responses:
        "200":
          description: The sync plan and what was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DidaSyncResult"
        "409":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/quick/{quickTaskId}:
    parameters:
      - name: quickTaskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateQuickTask
      tags: [tasks]
      description: >
        Partial update. completed flips the stored completed_at stamp; dates are
        '' or YYYY-MM-DD and a due date cannot precede a start date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: { type: string, minLength: 1, maxLength: 500 }
                notes: { type: string, maxLength: 2000 }
                tags:
                  type: array
                  maxItems: 12
                  items: { type: string, minLength: 1, maxLength: 40 }
                start_date: { type: string, pattern: "^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
                due_date: { type: string, pattern: "^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
                paper_id: { type: [string, "null"], format: uuid }
                completed: { type: boolean }
                position: { type: integer }
      responses:
        "200":
          description: Updated quick task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickTask"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteQuickTask
      tags: [tasks]
      responses:
        "204":
          description: Quick task deleted.
        "404":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      bearerFormat: ReFlowDeviceToken
  parameters:
    FeedId:
      name: feedId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AnnotationId:
      name: annotationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SyncAccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AIProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FolderId:
      name: folderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TagId:
      name: tagId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FilterId:
      name: filterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Request failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Status:
      type: object
      required: [status, version, api_version, database_ready, capabilities]
      properties:
        status:
          type: string
          enum: [ready, degraded]
        version:
          type: string
        api_version:
          type: string
        database_ready:
          type: boolean
        device_auth_required:
          type: boolean
        device_authenticated:
          type: boolean
        capabilities:
          type: array
          items:
            type: string
    Feed:
      type: object
      required: [id, url, title, failure_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        canonical_url:
          type: [string, "null"]
          format: uri
        doi:
          type: [string, "null"]
        site_url:
          type: [string, "null"]
          format: uri
        title:
          type: string
        content_kind:
          type: string
          enum: [general, literature, video, social]
        description:
          type: [string, "null"]
        icon_url:
          type: [string, "null"]
          format: uri
        format:
          type: [string, "null"]
          enum: [rss, atom, json, null]
        last_checked_at:
          type: [string, "null"]
          format: date-time
        last_success_at:
          type: [string, "null"]
          format: date-time
        failure_count:
          type: integer
          minimum: 0
        last_error_code:
          type: [string, "null"]
        last_error_message:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FeedCandidate:
      type: object
      required: [url, title]
      properties:
        url:
          type: string
          format: uri
        title:
          type: string
        site_url:
          type: [string, "null"]
          format: uri
    CreateFeedRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        folder_id:
          type: [string, "null"]
          format: uuid
        title_override:
          type: [string, "null"]
          maxLength: 300
    UpdateFeedRequest:
      type: object
      properties:
        folder_id:
          type: [string, "null"]
          format: uuid
        title_override:
          type: [string, "null"]
          maxLength: 300
        view_mode:
          type: string
          enum: [compact, standard, card, magazine, image]
        refresh_policy:
          type: string
          enum: [inherit, fixed, intelligent, never]
        refresh_interval_minutes:
          type: integer
          minimum: 0
          maximum: 10080
        hide_from_timeline:
          type: boolean
    Subscription:
      type: object
      required: [id, feed_id, title, feed_url, view_mode, hide_from_timeline]
      properties:
        id:
          type: string
          format: uuid
        feed_id:
          type: string
          format: uuid
        folder_id:
          type: [string, "null"]
          format: uuid
        title:
          type: string
        icon_url:
          type: [string, "null"]
          format: uri
        feed_url:
          type: string
          format: uri
        site_url:
          type: [string, "null"]
          format: uri
        unread_count:
          type: integer
          minimum: 0
        failure_count:
          type: integer
          minimum: 0
        last_error_code:
          type: [string, "null"]
        last_error_message:
          type: [string, "null"]
        last_success_at:
          type: [string, "null"]
          format: date-time
        view_mode:
          type: string
          enum: [compact, standard, card, magazine, image]
        refresh_policy:
          type: string
          enum: [inherit, fixed, intelligent, never]
        refresh_interval_minutes:
          type: integer
          minimum: 0
          maximum: 10080
        hide_from_timeline:
          type: boolean
    Folder:
      type: object
      required: [id, name, position, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        position:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Entry:
      type: object
      required: [id, feed_id, title, published_at, tag_ids, state]
      properties:
        id:
          type: string
          format: uuid
        feed_id:
          type: string
          format: uuid
        feed_title:
          type: string
        title:
          type: string
        author:
          type: [string, "null"]
        summary:
          type: [string, "null"]
        ai_translated_title:
          type: [string, "null"]
        ai_summary:
          type: [string, "null"]
        canonical_url:
          type: [string, "null"]
          format: uri
        lead_image_url:
          type: [string, "null"]
          format: uri
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
        published_at:
          type: string
          format: date-time
        state:
          $ref: "#/components/schemas/EntryState"
    EntryDetail:
      allOf:
        - $ref: "#/components/schemas/Entry"
        - type: object
          required: [sanitized_html]
          properties:
            sanitized_html:
              type: string
            readability_html:
              type: [string, "null"]
            audio_url:
              type: [string, "null"]
              format: uri
            video_url:
              type: [string, "null"]
              format: uri
    EntryState:
      type: object
      required: [is_read, is_starred, is_read_later, updated_at]
      properties:
        is_read:
          type: boolean
        is_starred:
          type: boolean
        is_read_later:
          type: boolean
        updated_at:
          type: string
          format: date-time
    EntryAnnotation:
      type: object
      required: [id, entry_id, style, quote, prefix, suffix, note, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        entry_id:
          type: string
          format: uuid
        style:
          type: string
          enum: [highlight, underline, wavy]
        quote:
          type: string
        prefix:
          type: string
        suffix:
          type: string
        note:
          type: string
        created_at:
          type: string
          format: date-time
