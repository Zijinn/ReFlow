    QuickTask:
      type: object
      description: >
        One flat 即时任务. It carries its own date window and completion stamp,
        but no layers, steps, or unlock state.
      required: [id, title, notes, tags, start_date, due_date, paper_id, completed_at, completed, position]
      properties:
        id: { type: string }
        title: { type: string, minLength: 1, maxLength: 500 }
        notes: { type: string, maxLength: 2000 }
        tags:
          type: array
          maxItems: 12
          items: { type: string, minLength: 1, maxLength: 40 }
        start_date: { type: string, pattern: "^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        due_date: { type: string, pattern: "^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        paper_id: { type: [string, "null"], format: uuid }
        completed_at: { type: string }
        completed: { type: boolean }
        position: { type: integer }
    DidaSyncResult:
      type: object
      description: >
        One Dida synchronization pass. Counts describe writes that actually
        landed; actions include dry-run plans, conflicts, orphans, and skips.
      required: [project, dry_run, state_file, created_in_dida, created_in_reflow, updated_in_dida, updated_in_reflow]
      properties:
        project:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
            kind: { type: string }
        dry_run: { type: boolean }
        seed: { type: string }
        state_file: { type: string }
        created_in_dida: { type: integer }
        created_in_reflow: { type: integer }
        updated_in_dida: { type: integer }
        updated_in_reflow: { type: integer }
        actions:
          type: array
          items:
            $ref: "#/components/schemas/DidaSyncAction"
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/DidaSyncAction"
        orphans:
          type: array
          items:
            $ref: "#/components/schemas/DidaSyncAction"
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/DidaSyncAction"
    DidaSyncAction:
      type: object
      required: [action]
      properties:
        action: { type: string }
        reflow_id: { type: string }
        dida_id: { type: string }
        title: { type: string }
        reason: { type: string }
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
