name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal; exit 1)
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/reflow-server
      - run: bash scripts/check-release-config.sh

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web lint
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      # The release workflow is the only other place build:desktop runs, so without this the
      # Wails-compatible HTML rewrite first gets checked at tag time.
      - run: pnpm --dir web build:desktop

  desktop:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - run: go vet -tags desktop ./cmd/reflow-desktop
        env:
          CGO_ENABLED: "1"
      - run: go build -tags desktop -o /tmp/reflow-desktop ./cmd/reflow-desktop
        env:
          CGO_ENABLED: "1"
